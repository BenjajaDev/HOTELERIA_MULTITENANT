server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Opcional: servir archivos estáticos con cache básico
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|png|jpe?g|gif|svg)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
